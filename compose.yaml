services:

  mysql:
    image: mysql:8
    container_name: student-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_db
    ports:
      - "3307:3306"

  backend:
    build: .
    container_name: student-backend
    ports:
      - "8080:8081"
    depends_on:
      - mysql